name: ESN event watcher

on:
  schedule:
       - cron: "4,19,34,49 * * * *"   # every 15 minutes (GitHub may delay runs a bit)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to save seen_events.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check for new events
        run: python esn_event_watcher.py --once
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save list of seen events
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_events.json
          git diff --cached --quiet || (git commit -m "Update seen events" && git push)
